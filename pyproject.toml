[project]
name = "appart-scout"
version = "0.1.0"
description = "Apartment hunter for the Zurich <-> Basel corridor"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "selectolax>=0.3.21",
    "rapidfuzz>=3.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10",
    "typer>=0.12",
    "rich>=13.7",
    "openai>=1.40",
    "pillow>=10.3",
]

[project.optional-dependencies]
# Needed for Homegate / ImmoScout24 / Newhome / Comparis, which block plain HTTP.
browser = ["playwright>=1.45"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
scout = "scout.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scout*"]

[tool.setuptools.package-data]
scout = ["web/templates/*.html", "web/static/*", "notify/templates/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
